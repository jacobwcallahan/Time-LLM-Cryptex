categorical:
  features: ["S", "M"]
  seq_len: [112, 224, 336] # 4 weeks, 8 weeks, 12 weeks
  pred_len: [12] # 3 days
  num_tokens: [100, 500, 1000]
  loss: ["MSE"]
  lradj: ["TST","type1","COS"]
  n_heads: [2, 4, 8, 16]
  d_ff: [32, 64, 128, 256]
  batch_size: [8,16]
  patch_len: [8, 16, 24]
  stride: [2, 4, 8, 12]
  epochs: [15] # Epochs must be more than 1

int:
  llm_layers:
    low: 4
    high: 8
  d_model:
    low: 32
    high: 64
    step: 16

float:
  dropout:
    low: 0.0
    high: 0.5
    step: 0.1
  pct_start:
    low: 0.1
    high: 0.5
    step: 0.1
  learning_rate:
    low: 1e-5
    high: 1e-1
    log: true

# log_float:
# Cannot be used if there are no parameters in the section