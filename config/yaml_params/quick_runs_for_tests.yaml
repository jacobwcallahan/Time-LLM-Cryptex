categorical:
  features: ["S",]
  seq_len: [8]
  pred_len: [4] # 1 Hour and 6 Hours
  num_tokens: [100]
  loss: ["MSE"]
  lradj: ["TST","type1","COS"]
  n_heads: [2]
  d_ff: [32]
  batch_size: [8]
  patch_len: [2]
  stride: [2]
  epochs: [1] # Epochs must be more than 1

int:
  llm_layers:
    low: 1
    high: 1
  d_model:
    low: 16
    high: 32
    step: 16

float:
  dropout:
    low: 0.0
    high: 0.5
    step: 0.1
  pct_start:
    low: 0.1
    high: 0.5
    step: 0.1
  learning_rate:
    low: 1e-5
    high: 1e-1
    log: true

# log_float:
# Cannot be used if there are no parameters in the section