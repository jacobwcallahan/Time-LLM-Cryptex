# python3 run_hpo.py --gpu 4 --study_name daily_search --granularity daily --start 2020-01-01 --end 2022-12-31 --inf_start 2023-01-01 --inf_end 2023-12-31 --returns --backtest --experiment_name daily_search --trials 50 --aggregate 1 --yaml_file daily_again.yaml


categorical:
  features: ["S"]
  seq_len: [180]
  pred_len: [14]
  num_tokens: [500, 1000]
  loss: ["MSE"]
  lradj: ["TST","type1","COS", "type3"]
  n_heads: [2, 4, 8, 16]
  d_ff: [32, 64, 128, 256]
  batch_size: [8,16]
  patch_len: [7,14,21]
  stride: [7, 20]
  epochs: [20] # Epochs must be more than 1

int:
  llm_layers:
    low: 1
    high: 2
  d_model:
    low: 16
    high: 32
    step: 16

float:
  dropout:
    low: 0.0
    high: 0.5
    step: 0.1
  pct_start:
    low: 0.1
    high: 0.5
    step: 0.1
  learning_rate:
    low: 1e-5
    high: 1e-1
    log: true

# log_float:
# Cannot be used if there are no parameters in the section